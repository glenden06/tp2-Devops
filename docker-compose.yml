version: '3.1'

services:

  db_mongo:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    container_name: db_mongo
    restart: on-failure
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: blog_db
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet",
             "-u", "${MONGO_ROOT_USER}",
             "-p", "${MONGO_ROOT_PASSWORD}",
             "--authenticationDatabase", "admin",
             "--eval", "var c=db.getSiblingDB('blog_db').posts.countDocuments(); if(c!==5){quit(1);}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  db_mysql:
    image: mysql:8.2
    container_name: db_mysql
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  admin_mongo:
    image: mongo-express
    container_name: admin_mongo
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: ${MONGO_URL}
    networks:
      - backend
    depends_on:
      db_mongo:
        condition: service_healthy

  admin_mysql:
    image: adminer
    container_name: admin_mysql
    restart: on-failure
    ports:
      - "8082:8080"
    networks:
      - backend
    depends_on:
      db_mysql:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: ${MONGO_URL}
      MYSQL_HOST: db_mysql
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - backend
    depends_on:
      db_mongo:
        condition: service_healthy
      db_mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/posts"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
  mysql_data:

networks:
  backend:
    driver: bridge